<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>64x64 Tile - Kavallerie Einheit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://pixijs.download/v7.3.2/pixi.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        #canvas-container {
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <script>
        // PixiJS Anwendung erstellen
        const app = new PIXI.Application({
            width: 64,
            height: 64,
            backgroundColor: 0x000000,
            resolution: window.devicePixelRatio || 1,
            autoDensity: true
        });

        document.getElementById('canvas-container').appendChild(app.view);

        // Graphics-Objekt für das Zeichnen
        const graphics = new PIXI.Graphics();
        app.stage.addChild(graphics);

        // Farbdefinitionen
        const COLORS = {
            background: 0x90EE90,    // Hellgrün
            stroke: 0x228B22,        // Dunkelgrün
            cavalry: 0x4169E1,       // Blau (Kavallerie)
            commander: 0xF5F5DC,     // Beige
            commanderStroke: 0x8B7355 // Dunkelbeige/Braun
        };

        // 1. Hintergrundfeld zeichnen
        graphics.beginFill(COLORS.background);
        graphics.lineStyle(0.5, COLORS.stroke, 1);
        graphics.drawRect(0, 0, 64, 64);
        graphics.endFill();

        // 2. Vier Kavallerie-Einheiten als Kreise zeichnen
        graphics.beginFill(COLORS.cavalry);
        graphics.lineStyle(0); // Kein Rand für Kreise
        
        // Oben links: (18, 18)
        graphics.drawCircle(18, 18, 10);
        
        // Oben rechts: (46, 18)
        graphics.drawCircle(46, 18, 10);
        
        // Unten links: (18, 46)
        graphics.drawCircle(18, 46, 10);
        
        // Unten rechts: (46, 46)
        graphics.drawCircle(46, 46, 10);
        
        graphics.endFill();

        // 3. Kommandeur in der Mitte als Quadrat zeichnen
        graphics.beginFill(COLORS.commander);
        graphics.lineStyle(0.25, COLORS.commanderStroke, 1); // Dünner brauner Rand
        graphics.drawRect(26, 26, 12, 12);
        graphics.endFill();

        // Optional: Vergrößerungsansicht für bessere Sichtbarkeit
        const scaleContainer = new PIXI.Container();
        scaleContainer.scale.set(4); // 4x Vergrößerung
        scaleContainer.position.set(0, 0);
        
        // Erstelle ein neues Graphics-Objekt für die vergrößerte Ansicht
        const scaledGraphics = new PIXI.Graphics();
        
        // Zeichne alles nochmal für die vergrößerte Ansicht
        scaledGraphics.beginFill(COLORS.background);
        scaledGraphics.lineStyle(0.5, COLORS.stroke, 1);
        scaledGraphics.drawRect(0, 0, 64, 64);
        scaledGraphics.endFill();

        scaledGraphics.beginFill(COLORS.cavalry);
        scaledGraphics.lineStyle(0);
        scaledGraphics.drawCircle(18, 18, 10);
        scaledGraphics.drawCircle(46, 18, 10);
        scaledGraphics.drawCircle(18, 46, 10);
        scaledGraphics.drawCircle(46, 46, 10);
        scaledGraphics.endFill();

        scaledGraphics.beginFill(COLORS.commander);
        scaledGraphics.lineStyle(0.25, COLORS.commanderStroke, 1);
        scaledGraphics.drawRect(26, 26, 12, 12);
        scaledGraphics.endFill();
        
        scaleContainer.addChild(scaledGraphics);
        
        // Neue Anwendung für vergrößerte Ansicht
        const scaledApp = new PIXI.Application({
            width: 320,
            height: 320,
            backgroundColor: 0x2a2a2a,
            resolution: window.devicePixelRatio || 1,
            autoDensity: true
        });
        
        document.getElementById('canvas-container').appendChild(scaledApp.view);
        scaledApp.stage.addChild(scaleContainer);
        
        // Beschriftung
        const style = new PIXI.TextStyle({
            fontFamily: 'Arial',
            fontSize: 12,
            fill: '#ffffff',
            align: 'center'
        });
        
        const label = new PIXI.Text('64x64 Tile (4x vergrößert)', style);
        label.position.set(160, 300);
        label.anchor.set(0.5);
        scaledApp.stage.addChild(label);
    </script>
</body>
</html>
